# ===========================================================================
# Fichier de configuration Hugo
# Remplace les valeurs ci-dessous par les tiennes.
# ===========================================================================

baseURL = "https://antonin-biernacki.github.io"
canonifyURLs = true
locale = "fr"
title = "Antonin Biernacki"

disableKinds = ["taxonomy", "term"]

[params]
  description = "Site personnel d'Antonin Biernacki."

[permalinks]
  [permalinks.page]
    actualites = "/actualites/:slug/"
    projets = "/projets/:slug/"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 4

[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML"]
