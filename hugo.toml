# ===========================================================================
# Fichier de configuration Hugo
# Remplace les valeurs ci-dessous par les tiennes.
# ===========================================================================

baseURL = "https://antonin-biernacki.github.io"
canonifyURLs = true
locale = "fr"
title = "Antonin Biernacki"

disableKinds = ["taxonomy", "term"]

[params]
  description = "Site personnel d'Antonin Biernacki."
  linkedin = "https://www.linkedin.com/in/antonin-biernacki"
  # L'adresse e-mail n'est pas écrite ici : elle est fournie au build par la variable
  # d'environnement HUGO_PARAMS_EMAIL (variable SITE_EMAIL du dépôt GitHub).

[permalinks]
  [permalinks.page]
    actualites = "/actualites/:slug/"
    projets = "/projets/:slug/"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 4

[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML"]
