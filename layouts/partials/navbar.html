{{/*
    Description: Barre de navigation affichée sur toutes les pages.
    CSS: static/assets/css/components/navbar.css
    Usage: Incluse dans layouts/_default/baseof.html
*/}}

{{ $url := .RelPermalink }}

<nav class="navbar">
  <div class="nav-container">
    <a href="{{ "/" | relURL }}" class="nav-logo">
      {{ site.Title }}
    </a>

    <button class="hamburger" id="hamburger" aria-label="Ouvrir le menu">
      <span></span>
      <span></span>
      <span></span>
    </button>

    <div class="nav-menu" id="nav-menu">
      <a href="{{ "/" | relURL }}"
         class="{{ if eq $url "/" }}active{{ end }}">Accueil</a>

      <a href="{{ "/projets/" | relURL }}"
         class="{{ if strings.Contains $url "/projets/" }}active{{ end }}">Projets</a>

      <a href="{{ "/actualites/" | relURL }}"
         class="{{ if strings.Contains $url "/actualites/" }}active{{ end }}">Actualités</a>
    </div>
  </div>
</nav>
