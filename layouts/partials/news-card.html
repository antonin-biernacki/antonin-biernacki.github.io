{{/*
    Description: Generates a card for each news item from the news section.
    CSS: static/assets/css/pages/news.css
    Usage: Included in layouts/news/list.html
*/}}

{{ $news := . }}
<div class="news_card">

    <div class="news_content">
        <h3 class="news_title">{{ $news.Title }}</h3>
        {{ with $news.Params.abstract }}
            <p class="news_abstract">{{ . }}</p>
        {{ end }}
        <a href="{{ $news.RelPermalink }}" class="news_btn">Lire la suite</a>
    </div>
</div>
